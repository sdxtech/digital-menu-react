name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      INVENTORY_TEST_MONGO_URI: mongodb://127.0.0.1:27028/?directConnection=true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Start isolated inventory test replica set
        run: |
          docker run --detach --rm --name digital-menu-inventory-test --publish 127.0.0.1:27028:27017 mongo:7 --replSet inventory-test --bind_ip_all
          timeout 60 bash -c 'until docker exec digital-menu-inventory-test mongosh --quiet --eval "db.adminCommand({ping: 1})"; do sleep 1; done'
          docker exec digital-menu-inventory-test mongosh --quiet --eval 'rs.initiate()'
          timeout 60 bash -c 'until docker exec digital-menu-inventory-test mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)"; do sleep 1; done'

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Stop inventory test replica set
        if: always()
        run: |
          if docker container inspect digital-menu-inventory-test > /dev/null 2>&1; then
            docker stop digital-menu-inventory-test
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
